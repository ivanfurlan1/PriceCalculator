<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotizador Vanchi | MD3 Dark</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    
    <style>
        :root {
            --surface-1: #111111;
            --surface-2: #1a1a1a;
            --surface-3: #222222;
            --accent-blue: #A8C7FA;
            --accent-green: #9BD67C;
            --accent-purple: #D0BCFF;
            --accent-red: #F2B8B5;
            --accent-orange: #FFB4A1;
            --on-surface: #E3E3E3;
            --on-surface-variant: #C4C7C5;
            --easing: cubic-bezier(0.2, 0, 0, 1);
        }

        body { 
            font-family: 'Google Sans', 'Roboto', sans-serif; 
            background-color: #000000;
            color: var(--on-surface);
            -webkit-tap-highlight-color: transparent;
        }

        /* Material Symbols setup */
        .material-symbols-rounded {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-unfilled { font-variation-settings: 'FILL' 0; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

        /* Inputs */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        /* Animations & Transitions */
        .md-transition { transition: all 0.3s var(--easing); }
        .md-active:active { transform: scale(0.96); }
        
        .tab-content { display: none; opacity: 0; transform: translateY(10px); }
        .tab-content.active { display: block; animation: tabEnter 0.4s var(--easing) forwards; }
        
        @keyframes tabEnter {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes itemEnter {
            from { opacity: 0; transform: scale(0.9) translateY(-10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-item-enter { animation: itemEnter 0.4s var(--easing) forwards; }

        /* Material 3 Switch */
        .md-switch {
            width: 52px; height: 32px;
            background-color: var(--surface-3);
            border: 2px solid #8E918F;
            border-radius: 16px;
            position: relative;
            cursor: pointer;
            transition: all 0.2s var(--easing);
        }
        .md-switch::after {
            content: '';
            position: absolute;
            top: 6px; left: 6px;
            width: 16px; height: 16px;
            background-color: #8E918F;
            border-radius: 50%;
            transition: all 0.2s var(--easing);
        }
        input:checked + .md-switch {
            background-color: var(--accent-blue);
            border-color: var(--accent-blue);
        }
        input:checked + .md-switch::after {
            background-color: #000;
            transform: translateX(20px) scale(1.3);
            top: 6px;
        }

        /* Nav Pills */
        .nav-pill { color: var(--on-surface-variant); transition: all 0.3s var(--easing); }
        .nav-pill.active { background-color: var(--surface-3); color: var(--on-surface); font-weight: 500; }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-24">

    <!-- Header Flotante -->
    <header class="fixed top-4 left-0 right-0 z-50 flex justify-center px-4 pointer-events-none">
        <div class="bg-[#1a1a1a]/80 backdrop-blur-xl border border-white/5 rounded-full px-5 py-2.5 flex items-center gap-6 shadow-2xl pointer-events-auto">
            <div class="flex items-center gap-2">
                <span class="material-symbols-rounded text-[var(--accent-blue)]">flight</span>
                <h1 class="text-lg font-medium tracking-tight text-white">Vanchi</h1>
            </div>
            <div class="h-5 w-px bg-white/10"></div>
            <div class="flex items-center gap-1.5 bg-black/40 rounded-full px-3 py-1">
                <span class="material-symbols-rounded text-[var(--accent-green)] text-sm">payments</span>
                <input type="number" id="usdRate" value="1520" class="bg-transparent text-[var(--on-surface)] font-medium w-12 outline-none text-right text-sm" oninput="calculateAll()">
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-5xl mx-auto w-full px-4 sm:px-6 mt-24">
        
        <!-- Pestañas -->
        <div class="flex bg-[var(--surface-1)] p-1.5 rounded-full w-full sm:w-fit mb-8 mx-auto sm:mx-0">
            <button onclick="switchTab('cotizador')" id="btn-cotizador" class="nav-pill active flex-1 sm:flex-none px-6 py-2.5 rounded-full text-sm flex items-center justify-center gap-2 md-active">
                <span class="material-symbols-rounded text-lg icon-unfilled">calculate</span> Cotizador
            </button>
            <button onclick="switchTab('config')" id="btn-config" class="nav-pill flex-1 sm:flex-none px-6 py-2.5 rounded-full text-sm flex items-center justify-center gap-2 md-active">
                <span class="material-symbols-rounded text-lg icon-unfilled">tune</span> Tarifas
            </button>
        </div>

        <!-- ========================================== -->
        <!-- TAB 1: COTIZADOR PRINCIPAL                 -->
        <!-- ========================================== -->
        <div id="tab-cotizador" class="tab-content active space-y-6">
            
            <!-- Botones Agregar -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <button onclick="addService('FPV')" class="bg-[var(--surface-1)] hover:bg-[var(--surface-2)] p-4 rounded-3xl flex items-center gap-4 md-transition md-active text-left border border-white/5">
                    <div class="bg-[#142336] text-[var(--accent-blue)] h-12 w-12 rounded-2xl flex items-center justify-center">
                        <span class="material-symbols-rounded">rocket_launch</span>
                    </div>
                    <div>
                        <h3 class="font-medium text-white text-sm">Drone FPV</h3>
                        <p class="text-[11px] text-[var(--on-surface-variant)]">Interior/Exterior 4K</p>
                    </div>
                </button>
                
                <button onclick="addService('EST')" class="bg-[var(--surface-1)] hover:bg-[var(--surface-2)] p-4 rounded-3xl flex items-center gap-4 md-transition md-active text-left border border-white/5">
                    <div class="bg-[#132A1B] text-[var(--accent-green)] h-12 w-12 rounded-2xl flex items-center justify-center">
                        <span class="material-symbols-rounded">flight_takeoff</span>
                    </div>
                    <div>
                        <h3 class="font-medium text-white text-sm">Drone Estabilizado</h3>
                        <p class="text-[11px] text-[var(--on-surface-variant)]">Cinemático / Loteos</p>
                    </div>
                </button>

                <button onclick="addService('GIMBAL')" class="bg-[var(--surface-1)] hover:bg-[var(--surface-2)] p-4 rounded-3xl flex items-center gap-4 md-transition md-active text-left border border-white/5">
                    <div class="bg-[#241738] text-[var(--accent-purple)] h-12 w-12 rounded-2xl flex items-center justify-center">
                        <span class="material-symbols-rounded">smartphone</span>
                    </div>
                    <div>
                        <h3 class="font-medium text-white text-sm">Gimbal + S25</h3>
                        <p class="text-[11px] text-[var(--on-surface-variant)]">Edición en tierra</p>
                    </div>
                </button>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start mt-8">
                
                <!-- Lista de Items -->
                <div class="lg:col-span-7 space-y-3">
                    <div class="flex justify-between items-center px-2 mb-2">
                        <h2 class="text-sm font-medium text-[var(--on-surface-variant)]">Detalle del rodaje</h2>
                        <button onclick="clearQuote()" class="text-xs text-[var(--accent-red)] hover:bg-[#311717] px-3 py-1.5 rounded-full md-transition md-active flex items-center gap-1">
                            <span class="material-symbols-rounded text-sm">delete</span> Limpiar
                        </button>
                    </div>

                    <div id="quoteItemsContainer" class="space-y-3 min-h-[200px] relative">
                        <!-- Empty State -->
                        <div class="absolute inset-0 flex flex-col items-center justify-center text-[var(--on-surface-variant)] md-transition" id="emptyState">
                            <span class="material-symbols-rounded text-5xl mb-3 opacity-20 icon-unfilled">receipt_long</span>
                            <p class="text-sm font-medium">Presupuesto vacío</p>
                        </div>
                    </div>
                </div>

                <!-- Resumen Final -->
                <div class="lg:col-span-5 bg-[var(--surface-1)] rounded-[32px] p-6 lg:p-8 sticky top-24 border border-white/5 shadow-2xl">
                    
                    <h3 class="text-xl font-medium mb-6">Total estimado</h3>
                    
                    <div class="space-y-4 mb-8">
                        <div class="flex justify-between items-center">
                            <span class="text-sm text-[var(--on-surface-variant)]">Producciones</span>
                            <span class="text-sm font-medium bg-[var(--surface-2)] px-3 py-1 rounded-full" id="resTotalProds">0</span>
                        </div>
                        
                        <div class="flex justify-between items-center">
                            <span class="text-sm text-[var(--on-surface-variant)]">Tarifa</span>
                            <span class="text-xs font-medium px-3 py-1 rounded-full bg-[var(--surface-2)] text-[var(--on-surface-variant)]" id="resPriceMode">UNIDAD</span>
                        </div>

                        <div class="bg-[var(--surface-2)] p-4 rounded-2xl mt-4">
                            <label class="text-xs text-[var(--on-surface-variant)] block mb-2">Viáticos / Extra ($)</label>
                            <input type="number" id="globalViaticos" value="0" class="w-full bg-black rounded-xl py-3 px-4 text-white text-base font-medium outline-none focus:ring-1 focus:ring-white/20 md-transition" oninput="calculateAll()">
                        </div>
                    </div>

                    <div class="flex justify-between items-end mb-2">
                        <span class="text-4xl font-medium tracking-tight text-white" id="resTotalArs">$0</span>
                    </div>
                    <div class="flex justify-end">
                        <span class="text-sm font-medium text-[var(--accent-green)]" id="resTotalUsd">U$D 0</span>
                    </div>

                    <!-- Rentabilidad -->
                    <div class="mt-8">
                        <div class="flex justify-between text-xs mb-2">
                            <span class="text-[var(--on-surface-variant)]">Margen de rebaja</span>
                            <span class="font-medium text-[var(--on-surface-variant)]">Piso: <span id="resPisoArs">$0</span></span>
                        </div>
                        <div class="w-full bg-[var(--surface-3)] rounded-full h-2 overflow-hidden">
                            <div id="profitBar" class="bg-[var(--on-surface-variant)] h-full rounded-full md-transition" style="width: 0%"></div>
                        </div>
                        <p id="profitMessage" class="text-xs mt-2 text-right text-[var(--on-surface-variant)]">Agregá servicios</p>
                    </div>

                </div>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- TAB 2: CONFIGURACIÓN DE TARIFAS            -->
        <!-- ========================================== -->
        <div id="tab-config" class="tab-content">
            <div class="max-w-3xl mx-auto space-y-4">
                <div class="flex justify-between items-center mb-6 px-2">
                    <h2 class="text-xl font-medium text-white">Tarifas Base</h2>
                    <button onclick="resetPrices()" class="bg-[var(--surface-2)] text-[var(--on-surface)] px-4 py-2 rounded-full text-xs font-medium md-transition md-active flex items-center gap-2">
                        <span class="material-symbols-rounded text-sm">restart_alt</span> Reset
                    </button>
                </div>

                <!-- Configuradores (Material 3 style) -->
                <div class="bg-[var(--surface-1)] rounded-[32px] p-6 border border-white/5 space-y-6">
                    
                    <!-- FPV -->
                    <div class="flex flex-col md:flex-row gap-4 items-start md:items-center">
                        <div class="md:w-1/4 flex items-center gap-3">
                            <div class="w-2 h-2 rounded-full bg-[var(--accent-blue)]"></div>
                            <h3 class="font-medium">FPV</h3>
                        </div>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 md:w-3/4 w-full">
                            <div class="bg-[var(--surface-2)] p-2 rounded-xl"><label class="text-[10px] text-[var(--on-surface-variant)] block px-1">Unidad</label><input type="number" id="priceFpvBase" value="350000" class="w-full bg-transparent text-sm px-1 py-1 outline-none text-white font-medium" oninput="calculateAll()"></div>
                            <div class="bg-[var(--surface-2)] p-2 rounded-xl"><label class="text-[10px] text-[var(--on-surface-variant)] block px-1">Combo 2+</label><input type="number" id="priceFpvCombo" value="300000" class="w-full bg-transparent text-sm px-1 py-1 outline-none text-white font-medium" oninput="calculateAll()"></div>
                            <div class="bg-[#311717]/50 p-2 rounded-xl"><label class="text-[10px] text-[var(--accent-red)] block px-1">Piso Mín.</label><input type="number" id="priceFpvMin" value="280000" class="w-full bg-transparent text-sm px-1 py-1 outline-none text-white font-medium" oninput="calculateAll()"></div>
                            <div class="bg-[#132A1B]/50 p-2 rounded-xl"><label class="text-[10px] text-[var(--accent-green)] block px-1">- Solo Ext.</label><input type="number" id="discountFpvExt" value="30000" class="w-full bg-transparent text-sm px-1 py-1 outline-none text-white font-medium" oninput="calculateAll()"></div>
                        </div>
                    </div>

                    <div class="h-px bg-white/5 w-full"></div>

                    <!-- EST -->
                    <div class="flex flex-col md:flex-row gap-4 items-start md:items-center">
                        <div class="md:w-1/4 flex items-center gap-3">
                            <div class="w-2 h-2 rounded-full bg-[var(--accent-green)]"></div>
                            <h3 class="font-medium">Estabilizado</h3>
                        </div>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 md:w-3/4 w-full">
                            <div class="bg-[var(--surface-2)] p-2 rounded-xl"><label class="text-[10px] text-[var(--on-surface-variant)] block px-1">Unidad</label><input type="number" id="priceEstBase" value="280000" class="w-full bg-transparent text-sm px-1 py-1 outline-none text-white font-medium" oninput="calculateAll()"></div>
                            <div class="bg-[var(--surface-2)] p-2 rounded-xl"><label class="text-[10px] text-[var(--on-surface-variant)] block px-1">Combo 2+</label><input type="number" id="priceEstCombo" value="250000" class="w-full bg-transparent text-sm px-1 py-1 outline-none text-white font-medium" oninput="calculateAll()"></div>
                            <div class="bg-[#311717]/50 p-2 rounded-xl"><label class="text-[10px] text-[var(--accent-red)] block px-1">Piso Mín.</label><input type="number" id="priceEstMin" value="230000" class="w-full bg-transparent text-sm px-1 py-1 outline-none text-white font-medium" oninput="calculateAll()"></div>
                        </div>
                    </div>

                    <div class="h-px bg-white/5 w-full"></div>

                    <!-- GIMBAL -->
                    <div class="flex flex-col md:flex-row gap-4 items-start md:items-center">
                        <div class="md:w-1/4 flex items-center gap-3">
                            <div class="w-2 h-2 rounded-full bg-[var(--accent-purple)]"></div>
                            <h3 class="font-medium">Gimbal</h3>
                        </div>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 md:w-3/4 w-full">
                            <div class="bg-[var(--surface-2)] p-2 rounded-xl"><label class="text-[10px] text-[var(--on-surface-variant)] block px-1">Unidad</label><input type="number" id="priceGimbalBase" value="150000" class="w-full bg-transparent text-sm px-1 py-1 outline-none text-white font-medium" oninput="calculateAll()"></div>
                            <div class="bg-[var(--surface-2)] p-2 rounded-xl"><label class="text-[10px] text-[var(--on-surface-variant)] block px-1">Combo 2+</label><input type="number" id="priceGimbalCombo" value="120000" class="w-full bg-transparent text-sm px-1 py-1 outline-none text-white font-medium" oninput="calculateAll()"></div>
                            <div class="bg-[#311717]/50 p-2 rounded-xl"><label class="text-[10px] text-[var(--accent-red)] block px-1">Piso Mín.</label><input type="number" id="priceGimbalMin" value="120000" class="w-full bg-transparent text-sm px-1 py-1 outline-none text-white font-medium" oninput="calculateAll()"></div>
                        </div>
                    </div>
                    
                    <div class="h-px bg-white/5 w-full"></div>

                    <!-- EXTRAS -->
                    <div class="flex flex-col md:flex-row gap-4 items-start md:items-center">
                        <div class="md:w-1/4 flex items-center gap-3">
                            <div class="w-2 h-2 rounded-full bg-[var(--accent-orange)]"></div>
                            <h3 class="font-medium">Extras</h3>
                        </div>
                        <div class="w-full md:w-1/4">
                            <div class="bg-[var(--surface-2)] p-2 rounded-xl"><label class="text-[10px] text-[var(--on-surface-variant)] block px-1">Locación extra</label><input type="number" id="priceExtraLoc" value="50000" class="w-full bg-transparent text-sm px-1 py-1 outline-none text-white font-medium" oninput="calculateAll()"></div>
                        </div>
                    </div>

                </div>
            </div>
        </div>

    </main>

    <!-- Template de Ítem Generado -->
    <template id="itemTemplate">
        <div class="bg-[var(--surface-1)] rounded-3xl p-5 relative quote-item md-transition animate-item-enter border border-white/5" data-id="">
            
            <button onclick="removeService(this)" class="absolute top-4 right-4 text-[var(--on-surface-variant)] hover:text-white bg-[var(--surface-2)] rounded-full w-8 h-8 flex items-center justify-center md-transition md-active">
                <span class="material-symbols-rounded text-sm">close</span>
            </button>
            
            <div class="flex flex-col sm:flex-row gap-5">
                <div class="flex-1">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="icon-container flex items-center justify-center"></div>
                        <h4 class="font-medium text-white text-base service-title">Servicio</h4>
                    </div>
                    
                    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
                        <div class="bg-[var(--surface-2)] p-2.5 rounded-2xl flex flex-col items-center">
                            <label class="text-[10px] text-[var(--on-surface-variant)] mb-1">Cant. Videos</label>
                            <input type="number" min="1" value="1" class="qty-input w-full bg-transparent text-center text-lg text-white font-medium outline-none" oninput="calculateAll()">
                        </div>
                        
                        <div class="bg-[var(--surface-2)] p-2.5 rounded-2xl flex flex-col items-center">
                            <label class="text-[10px] text-[var(--on-surface-variant)] mb-1">Locs. Extra</label>
                            <input type="number" min="0" value="0" class="loc-input w-full bg-transparent text-center text-lg text-white font-medium outline-none" oninput="calculateAll()">
                        </div>

                        <!-- FPV Switch -->
                        <div class="col-span-2 fpv-options hidden bg-[var(--surface-2)] px-4 py-2.5 rounded-2xl flex items-center justify-between">
                            <div>
                                <span class="text-sm font-medium text-white block">Solo Exterior</span>
                                <span class="text-[10px] text-[var(--on-surface-variant)]">Menor riesgo/precio</span>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" class="sr-only fpv-ext-checkbox" onchange="calculateAll()">
                                <div class="md-switch"></div>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="flex flex-col justify-center sm:items-end sm:w-32 sm:pl-4 pt-4 sm:pt-0 border-t sm:border-t-0 sm:border-l border-white/5">
                    <span class="text-[10px] text-[var(--on-surface-variant)] mb-1">Subtotal</span>
                    <span class="text-xl font-medium text-white item-subtotal-ars">$0</span>
                </div>
            </div>
        </div>
    </template>

    <script>
        // Lógica de Tabs
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-pill').forEach(el => {
                el.classList.remove('active');
                el.classList.add('icon-unfilled'); // Solo visual para la fuente
            });
            
            document.getElementById(`tab-${tabId}`).classList.add('active');
            
            const btn = document.getElementById(`btn-${tabId}`);
            btn.classList.add('active');
            btn.querySelector('.material-symbols-rounded').classList.remove('icon-unfilled');
        }

        let itemIdCounter = 0;
        const DEFAULTS = {
            fpvBase: 350000, fpvCombo: 300000, fpvMin: 280000, fpvExtDiscount: 30000,
            estBase: 280000, estCombo: 250000, estMin: 230000,
            gimbalBase: 150000, gimbalCombo: 120000, gimbalMin: 120000,
            extraLoc: 50000
        };

        function formatARS(num) {
            return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(num);
        }
        
        function formatUSD(num) {
            return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(num);
        }

        function getPrices() {
            return {
                FPV: {
                    base: Number(document.getElementById('priceFpvBase').value) || 0,
                    combo: Number(document.getElementById('priceFpvCombo').value) || 0,
                    min: Number(document.getElementById('priceFpvMin').value) || 0,
                    extDiscount: Number(document.getElementById('discountFpvExt').value) || 0
                },
                EST: {
                    base: Number(document.getElementById('priceEstBase').value) || 0,
                    combo: Number(document.getElementById('priceEstCombo').value) || 0,
                    min: Number(document.getElementById('priceEstMin').value) || 0
                },
                GIMBAL: {
                    base: Number(document.getElementById('priceGimbalBase').value) || 0,
                    combo: Number(document.getElementById('priceGimbalCombo').value) || 0,
                    min: Number(document.getElementById('priceGimbalMin').value) || 0
                },
                extraLoc: Number(document.getElementById('priceExtraLoc').value) || 0,
                usd: Number(document.getElementById('usdRate').value) || 1
            };
        }

        function resetPrices() {
            document.getElementById('priceFpvBase').value = DEFAULTS.fpvBase;
            document.getElementById('priceFpvCombo').value = DEFAULTS.fpvCombo;
            document.getElementById('priceFpvMin').value = DEFAULTS.fpvMin;
            document.getElementById('discountFpvExt').value = DEFAULTS.fpvExtDiscount;
            
            document.getElementById('priceEstBase').value = DEFAULTS.estBase;
            document.getElementById('priceEstCombo').value = DEFAULTS.estCombo;
            document.getElementById('priceEstMin').value = DEFAULTS.estMin;
            
            document.getElementById('priceGimbalBase').value = DEFAULTS.gimbalBase;
            document.getElementById('priceGimbalCombo').value = DEFAULTS.gimbalCombo;
            document.getElementById('priceGimbalMin').value = DEFAULTS.gimbalMin;
            
            document.getElementById('priceExtraLoc').value = DEFAULTS.extraLoc;
            calculateAll();
        }

        function addService(type) {
            const emptyState = document.getElementById('emptyState');
            if(emptyState) emptyState.style.opacity = '0';
            
            const container = document.getElementById('quoteItemsContainer');
            const template = document.getElementById('itemTemplate').content.cloneNode(true);
            const item = template.querySelector('.quote-item');
            
            item.dataset.id = itemIdCounter++;
            item.dataset.type = type;
            
            const titleEl = item.querySelector('.service-title');
            const iconEl = item.querySelector('.icon-container');
            const fpvOptions = item.querySelector('.fpv-options');

            if (type === 'FPV') {
                titleEl.textContent = 'Drone FPV';
                iconEl.innerHTML = '<span class="material-symbols-rounded text-[var(--accent-blue)]">rocket_launch</span>';
                fpvOptions.classList.remove('hidden');
            } else if (type === 'EST') {
                titleEl.textContent = 'Drone Estabilizado';
                iconEl.innerHTML = '<span class="material-symbols-rounded text-[var(--accent-green)]">flight_takeoff</span>';
            } else if (type === 'GIMBAL') {
                titleEl.textContent = 'Gimbal + S25';
                iconEl.innerHTML = '<span class="material-symbols-rounded text-[var(--accent-purple)]">smartphone</span>';
            }

            container.appendChild(item);
            setTimeout(() => { if(emptyState) emptyState.style.display = 'none'; }, 300);
            calculateAll();
        }

        function removeService(btn) {
            const item = btn.closest('.quote-item');
            item.style.opacity = '0';
            item.style.transform = 'scale(0.9) translateY(-10px)';
            
            setTimeout(() => {
                item.remove();
                const container = document.getElementById('quoteItemsContainer');
                if (container.querySelectorAll('.quote-item').length === 0) {
                    const emptyState = document.getElementById('emptyState');
                    emptyState.style.display = 'flex';
                    setTimeout(() => emptyState.style.opacity = '1', 10);
                }
                calculateAll();
            }, 300);
        }

        function clearQuote() {
            document.querySelectorAll('.quote-item').forEach(item => {
                item.style.opacity = '0';
                item.style.transform = 'scale(0.9)';
                setTimeout(() => item.remove(), 300);
            });
            setTimeout(() => {
                const emptyState = document.getElementById('emptyState');
                emptyState.style.display = 'flex';
                setTimeout(() => emptyState.style.opacity = '1', 10);
                document.getElementById('globalViaticos').value = 0;
                calculateAll();
            }, 300);
        }

        function calculateAll() {
            const prices = getPrices();
            const items = document.querySelectorAll('.quote-item');
            let totalProductions = 0;
            
            items.forEach(item => totalProductions += Number(item.querySelector('.qty-input').value) || 0);

            const isCombo = totalProductions >= 2;
            let finalTotalARS = 0;
            let absoluteMinPisoARS = 0;

            items.forEach(item => {
                const type = item.dataset.type;
                const qty = Number(item.querySelector('.qty-input').value) || 0;
                const locExtra = Number(item.querySelector('.loc-input').value) || 0;
                
                let basePrice = isCombo ? prices[type].combo : prices[type].base;
                let minPrice = prices[type].min;
                
                if (type === 'FPV') {
                    if (item.querySelector('.fpv-ext-checkbox').checked) {
                        basePrice -= prices.FPV.extDiscount;
                        minPrice -= prices.FPV.extDiscount; 
                    }
                }

                const locExtraTotal = locExtra * prices.extraLoc;
                const itemSubtotal = (basePrice * qty) + locExtraTotal;
                const itemMinPiso = (minPrice * qty) + (prices.extraLoc * locExtra * 0.8);

                item.querySelector('.item-subtotal-ars').textContent = formatARS(itemSubtotal);
                finalTotalARS += itemSubtotal;
                absoluteMinPisoARS += itemMinPiso;
            });

            const viaticos = Number(document.getElementById('globalViaticos').value) || 0;
            finalTotalARS += viaticos;
            absoluteMinPisoARS += viaticos; 

            // Update UI
            document.getElementById('resTotalProds').textContent = totalProductions;
            
            const modeEl = document.getElementById('resPriceMode');
            if(totalProductions === 0) {
                modeEl.textContent = "-";
                modeEl.className = "text-xs font-medium px-3 py-1 rounded-full bg-[var(--surface-2)] text-[var(--on-surface-variant)]";
            } else if (isCombo) {
                modeEl.textContent = "COMBO ACTIVO";
                modeEl.className = "text-xs font-medium px-3 py-1 rounded-full bg-[#132A1B] text-[var(--accent-green)]";
            } else {
                modeEl.textContent = "UNIDAD";
                modeEl.className = "text-xs font-medium px-3 py-1 rounded-full bg-[#142336] text-[var(--accent-blue)]";
            }

            document.getElementById('resTotalArs').textContent = formatARS(finalTotalARS);
            document.getElementById('resTotalUsd').textContent = formatUSD(finalTotalARS / prices.usd);
            document.getElementById('resPisoArs').textContent = formatARS(absoluteMinPisoARS);

            // Analizador MD3
            const profitBar = document.getElementById('profitBar');
            const profitMsg = document.getElementById('profitMessage');

            if(finalTotalARS > 0) {
                let maxTeorico = viaticos;
                items.forEach(item => {
                    const type = item.dataset.type;
                    const qty = Number(item.querySelector('.qty-input').value) || 0;
                    const locExtra = Number(item.querySelector('.loc-input').value) || 0;
                    maxTeorico += (prices[type].base * qty) + (locExtra * prices.extraLoc);
                });

                let percentage = 100;
                if (maxTeorico > absoluteMinPisoARS) {
                   percentage = ((finalTotalARS - absoluteMinPisoARS) / (maxTeorico - absoluteMinPisoARS)) * 100;
                }
                
                percentage = Math.max(0, Math.min(100, percentage));
                profitBar.style.width = percentage + '%';

                if(percentage > 75) {
                    profitBar.className = "bg-[var(--accent-green)] h-full rounded-full md-transition";
                    profitMsg.textContent = 'Margen óptimo (Tarifa base)';
                    profitMsg.className = "text-xs mt-2 text-right text-[var(--accent-green)]";
                } else if (percentage > 35) {
                    profitBar.className = "bg-[var(--accent-blue)] h-full rounded-full md-transition";
                    profitMsg.textContent = 'Margen regular (Tarifa combo)';
                    profitMsg.className = "text-xs mt-2 text-right text-[var(--accent-blue)]";
                } else if (percentage > 5) {
                    profitBar.className = "bg-[var(--accent-orange)] h-full rounded-full md-transition";
                    profitMsg.textContent = 'Precaución: Cerca del piso mínimo';
                    profitMsg.className = "text-xs mt-2 text-right text-[var(--accent-orange)]";
                } else {
                    profitBar.className = "bg-[var(--accent-red)] h-full rounded-full md-transition";
                    profitMsg.textContent = 'Alerta: Llegaste al límite de descuento';
                    profitMsg.className = "text-xs mt-2 text-right text-[var(--accent-red)]";
                }
            } else {
                profitBar.style.width = '0%';
                profitMsg.textContent = "Agregá servicios";
                profitMsg.className = "text-xs mt-2 text-right text-[var(--on-surface-variant)]";
            }
        }

        calculateAll();
    </script>
</body>
</html>
